name: Production CI & Verification Pipeline

on:
  push:
    branches: [ main, add-real-openaq-data ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Test & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Geospatial Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev gdal-bin libgdal-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax & Compilation Check
        run: |
          python -m py_compile app.py
          python -m py_compile src/phase20/*.py

      - name: Run Phase 20 Application Test Suite (18 Tests)
        run: |
          python tests/test_phase20_app.py

      - name: Run Target-Centric Inflow Query Regression Suite (9 Tests)
        run: |
          python scripts/run_target_query_tests.py

      - name: Run Phase 21 Core Verification Suite (13 Checks)
        run: |
          python scripts/run_phase21_verification.py
